version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/raf.db
      - DATA_DIR=./data
      - OUTPUTS_DIR=./outputs
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:8501"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
