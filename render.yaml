services:
  - type: web
    name: raf-app
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/raf.db
      - key: DATA_DIR
        value: ./data
      - key: OUTPUTS_DIR
        value: ./outputs
      - key: LOG_LEVEL
        value: INFO
